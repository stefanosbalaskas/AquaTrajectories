url: https://stefanosbalaskas.github.io/AquaTrajectories/
destination: site
title: AquaTrajectories — aquatic movement science
template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  bslib:
    primary: "#147F97"
    secondary: "#39566E"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Manrope"}
    code_font: {google: "JetBrains Mono"}
navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]
