name: Milestone 08 - reference-conditional fish measurement validation

on:
  pull_request:
    paths:
      - "R/reference-measurement-validation.R"
      - "inst/python/aqt_m08_reference_measurement.py"
      - "inst/python/aqt_m08_independent_oracle.py"
      - "inst/python/aqt_m08_source_clip_sensitivity.py"
      - "tests/python/test_m08_reference_measurement.py"
      - "tests/testthat/test-reference-measurement-validation.R"
      - "docs/BRACKISH_MEASUREMENT_VALIDATION_M08.md"
      - "man/aqt_reference_measurement_validate.Rd"
      - "man/aqt_reference_measurement_publish.Rd"
      - ".github/workflows/reference-measurement-validation-m08.yml"
  push:
    branches: [main]
    paths:
      - "R/reference-measurement-validation.R"
      - "inst/python/aqt_m08_reference_measurement.py"
      - "inst/python/aqt_m08_independent_oracle.py"
      - "tests/python/test_m08_reference_measurement.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-oracles-and-native-r:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent scientific evaluation dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.11,<2' 'matplotlib>=3.8,<4'
      - name: Python source separation, exact assignment and real-report contract fixture
        run: |
          python -m py_compile inst/python/aqt_m08_reference_measurement.py inst/python/aqt_m08_independent_oracle.py inst/python/aqt_m08_source_clip_sensitivity.py
          python -m unittest discover -s tests/python -p 'test_m08_reference_measurement.py' -v
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: local::.
          extra-packages: any::roxygen2
      - name: R source/docs generation consistency
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git diff --exit-code -- NAMESPACE man
      - name: Install exact native source and run M08 R numerical tests
        run: |
          R CMD INSTALL .
          Rscript -e 'library(aquaTrajectories); stopifnot(is.function(aqt_reference_measurement_validate),is.function(aqt_reference_measurement_publish)); testthat::test_file("tests/testthat/test-reference-measurement-validation.R")'
      - name: Never mutate source files during fixture tests
        run: git diff --exit-code -- R/ inst/python/ tests/ docs/
