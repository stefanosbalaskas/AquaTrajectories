name: Wave 15A - native automatic crosscamera fish IDs and refractive 3D contracts
on:
  pull_request:
    paths:
      - "R/automatic-crossview-refractive.R"
      - "tests/testthat/test-automatic-crossview-refractive.R"
      - "man/aqt_refractive_view_candidates.Rd"
      - "man/aqt_crossview_auto_associate.Rd"
      - "man/aqt_auto_refractive_pipeline.Rd"
      - "NAMESPACE"
      - "DESCRIPTION"
      - "docs/AUTOMATIC_CROSSVIEW_REFRACTIVE_PIPELINE.md"
      - ".github/workflows/native-auto-crossview-fish.yml"
  push:
    branches: [main]
    paths:
      - "R/automatic-crossview-refractive.R"
      - "tests/testthat/test-automatic-crossview-refractive.R"
      - "man/aqt_refractive_view_candidates.Rd"
      - "man/aqt_crossview_auto_associate.Rd"
      - "man/aqt_auto_refractive_pipeline.Rd"
      - ".github/workflows/native-auto-crossview-fish.yml"

permissions:
  contents: read

jobs:
  native-crosscamera-fish-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: local::.
      - name: Test exact native R crossview functions on synthetic known XYZ
        run: |
          Rscript -e "pkgload::load_all('.', quiet=TRUE);testthat::test_file('tests/testthat/test-automatic-crossview-refractive.R')"
      - name: Check namespace and documentation for all native crosscamera functions
        run: |
          Rscript -e "stopifnot(all(c('aqt_refractive_view_candidates','aqt_crossview_auto_associate','aqt_auto_refractive_pipeline') %in% getNamespaceExports('aquaTrajectories')))"
