name: Milestone 07 - frame-indexed real fish dual-path scientific workflow

on:
  pull_request:
    paths:
      - "R/frame-index-research.R"
      - "inst/python/aqt_m07_*.py"
      - "tests/testthat/test-frame-index-research.R"
      - "tests/integration/brackish_real_dual_path_m07.R"
      - "tests/python/test_m07_python_oracle.py"
      - "docs/BRACKISH_REAL_DUAL_PATH_M07.md"
      - "NAMESPACE"
      - "man/aqt_frame_index_*.Rd"
      - ".github/workflows/real-brackish-dual-path-m07.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-r-and-python-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cross-language Python syntax and fail-closed fixture contracts
        run: |
          python -m py_compile inst/python/aqt_m07_brackish_dual_path.py inst/python/aqt_m07_independent_frame_oracle.py
          python -m unittest discover -s tests/python -p 'test_m07_python_oracle.py' -v
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::testthat, any::roxygen2, any::jsonlite, any::digest
      - name: Generate R documentation and verify new API exports
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          Rscript -e 'x <- readLines("NAMESPACE"); stopifnot(all(c("export(aqt_frame_index_analyze)","export(aqt_frame_index_publish)") %in% x))'
      - name: Install R package after regenerated documentation
        run: |
          R CMD INSTALL .
      - name: Native R frame-index arithmetic, identity scope, and time refusal
        run: |
          Rscript -e 'library(aquaTrajectories); testthat::test_file("tests/testthat/test-frame-index-research.R", reporter="summary", stop_on_failure=TRUE)'
      - name: Source files unchanged by tests
        run: |
          git diff --exit-code -- R inst/python tests
