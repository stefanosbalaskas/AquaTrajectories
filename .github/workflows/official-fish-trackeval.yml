name: Wave 14B - official TrackEval HOTA IDF1 CLEAR fish ID scoring

on:
  pull_request:
    paths:
      - "inst/python/aqt_official_fish_trackeval.py"
      - "tests/python/test_official_fish_trackeval.py"
      - "docs/OFFICIAL_FISH_HOTA_IDF1_PROTOCOL.md"
      - ".github/workflows/official-fish-trackeval.yml"
  push:
    branches: [main]
    paths:
      - "inst/python/aqt_official_fish_trackeval.py"
      - "tests/python/test_official_fish_trackeval.py"
      - ".github/workflows/official-fish-trackeval.yml"

permissions:
  contents: read

jobs:
  official-identity-metric-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install compatible numerical runtime and pinned official TrackEval
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.23.5" "scipy==1.10.1"
          mkdir -p "$RUNNER_TEMP/trackeval"
          git clone "https://github.com/JonathonLuiten/TrackEval.git" "$RUNNER_TEMP/trackeval"
          git -C "$RUNNER_TEMP/trackeval" checkout 12c8791b303e0a0b50f753af204249e622d0281a
          test "$(git -C "$RUNNER_TEMP/trackeval" rev-parse HEAD)" = \
            12c8791b303e0a0b50f753af204249e622d0281a
          python -m pip install --no-deps --no-build-isolation -e "$RUNNER_TEMP/trackeval"
      - name: Actual unmodified official metric implementation and fish ID tests
        run: |
          python -m py_compile inst/python/aqt_official_fish_trackeval.py
          python -m unittest discover -s tests/python -p "test_official_fish_trackeval.py" -v
      - name: Original scientific claims are explicitly NOT certified by synthetic test
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("inst/python/aqt_official_fish_trackeval.py").read_text()
          assert "independent_prediction_accuracy_certified" in s
          assert "underwater_physical_xyz_accuracy_certified" in s
          print("Official TrackEval metrics contract tested. No genuine fish-model identity accuracy certified.")
          PY
