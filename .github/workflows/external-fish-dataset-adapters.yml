name: External fish dataset annotation adapters

on:
  pull_request:
    paths:
      - "inst/python/aqt_public_fish_adapters.py"
      - "tests/python/test_public_fish_adapters.py"
      - "inst/python/aqt_fishtrac_detection_probe.py"
      - "tests/python/test_fishtrac_detection_probe.py"
      - "docs/EXTERNAL_FISH_DATASET_INGESTION.md"
      - ".github/workflows/external-fish-dataset-adapters.yml"
  push:
    branches: [main]
    paths:
      - "inst/python/aqt_public_fish_adapters.py"
      - "tests/python/test_public_fish_adapters.py"
      - "inst/python/aqt_fishtrac_detection_probe.py"
      - "tests/python/test_fishtrac_detection_probe.py"
      - ".github/workflows/external-fish-dataset-adapters.yml"

permissions:
  contents: read

jobs:
  external-fish-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m py_compile inst/python/aqt_public_fish_adapters.py
      - name: Evaluate native Datumaro and MOT fish-reference contracts
        run: python -m unittest discover -s tests/python -p 'test_public_fish_adapters.py' -v
      - name: Test independent FISHTRAC detector-only schema contracts
        run: python -m unittest discover -s tests/python -p 'test_fishtrac_detection_probe.py' -v
      - name: Inspect exact original published FISHTRAC detector CSV
        shell: bash
        run: |
          curl --fail --show-error --location --retry 2 --max-time 90 \
            https://raw.githubusercontent.com/tmandel/fish-detrac/master/fishtrac/trackers/VFT/detections.csv \
            --output "$RUNNER_TEMP/fishtrac_detections.csv"
          test "$(git hash-object "$RUNNER_TEMP/fishtrac_detections.csv")" = "f6d7538c4799742e18f7df0df2afd08da716116c"
          python inst/python/aqt_fishtrac_detection_probe.py \
            --input "$RUNNER_TEMP/fishtrac_detections.csv" \
            --frame-origin 1 \
            --output "$RUNNER_TEMP/fishtrac_structural_report.json"
          python -c 'import json,os; a=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"fishtrac_structural_report.json"))); assert a["n_detection_rows"] == 171; assert a["n_frames_with_detections"] == 71; assert not a["individual_fish_ids_provided"] and not a["actual_camera_pts_provided"]'

