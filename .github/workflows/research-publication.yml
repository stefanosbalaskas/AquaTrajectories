name: Milestone 04 - reproducible scientific publication figures and reports

on:
  pull_request:
    paths:
      - "R/research-publication-*.R"
      - "tests/testthat/test-research-publication.R"
      - "tests/integration/research_bundle_publication.R"
      - "docs/PUBLICATION_RESEARCH_REPORT_V1.md"
      - "NAMESPACE"
      - "man/aqt_research_*.Rd"
      - "_pkgdown.yml"
      - ".github/workflows/research-publication.yml"
  push:
    branches: [main]
    paths:
      - "R/research-publication-*.R"
      - "tests/testthat/test-research-publication.R"
      - "tests/integration/research_bundle_publication.R"
      - ".github/workflows/research-publication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-scientific-publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create synthetic tracker source files in Python
        run: |
          python -m unittest discover -s tests/python -p "test_research_bundle.py" -v
          python tests/python/generate_research_bundle_fixtures.py "$RUNNER_TEMP/aqt-publication"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: local::.
          extra-packages: any::testthat, any::roxygen2
      - name: Exact-source public documentation consistency
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git diff --exit-code -- NAMESPACE man
      - name: Source-preserving numerical and PNG/PDF publication tests
        run: |
          Rscript -e 'library(aquaTrajectories); testthat::test_file("tests/testthat/test-research-publication.R", reporter="summary", stop_on_failure=TRUE)'
      - name: Python-native bundle to R report and cryptographic bytes audit
        run: |
          Rscript --vanilla tests/integration/research_bundle_publication.R "$RUNNER_TEMP/aqt-publication"
      - name: Ensure source and original scientific tests remain read only
        run: |
          git diff --exit-code -- R tests inst/python
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: milestone04-native-publication-evidence
          path: ${{ runner.temp }}/aqt-publication/
          if-no-files-found: error
