name: Evidence safeguards example qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full-evidence-example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rmarkdown, any::knitr
      - name: Install the exact checkout
        run: Rscript -e "install.packages('.', repos=NULL, type='source')"
      - name: Complete synthetic trajectory-to-evidence regression
        run: Rscript inst/examples/evidence_guardrails.R
      - name: Render executable evidence report
        run: Rscript -e "rmarkdown::render('inst/examples/evidence_guardrails.Rmd', output_file='evidence_guardrails.html', output_dir=tempdir(), quiet=TRUE)"
