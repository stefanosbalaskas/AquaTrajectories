name: R qualification

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r-cmd-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2, any::rcmdcheck
      - name: Generate R documentation
        run: Rscript -e 'roxygen2::roxygenise()'
      - name: Verify tracked documentation is synchronized (never push bot commits)
        shell: bash
        run: |
          if ! git diff --exit-code -- NAMESPACE man; then
            echo "::error::Generated R NAMESPACE/man drift. Run roxygen2::roxygenise() locally and commit the reviewed changes."
            exit 1
          fi
      - name: Test R package
        run: Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual"), error_on = "warning")'
