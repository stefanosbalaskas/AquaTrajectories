name: R qualification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  r-cmd-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2, any::rcmdcheck
      - name: Generate R documentation
        run: Rscript -e 'roxygen2::roxygenise()'
      - name: Test R package
        run: Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual"), error_on = "warning")'
