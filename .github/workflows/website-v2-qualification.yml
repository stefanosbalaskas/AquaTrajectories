name: AquaTrajectories Website v2 independent qualification
on:
  pull_request:
    branches: [main]
    paths:
      - "pkgdown/**"
      - "vignettes/**"
      - "scripts/**"
      - "tests/browser/**"
      - ".github/workflows/website-v2-qualification.yml"
  push:
    branches: [main]
    paths:
      - "pkgdown/**"
      - "vignettes/**"
      - "scripts/**"
      - "tests/browser/**"
      - ".github/workflows/website-v2-qualification.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: local::.
      - name: Assert browser native R source modules match archived release source
        run: |
          cmp R/tracks.R pkgdown/assets/native-v0.1.1-tracks.R
          cmp R/kinematics.R pkgdown/assets/native-v0.1.1-kinematics.R
      - name: Cross-language numerical parity against released native R API
        run: |
          node scripts/create_browser_parity_fixtures.mjs
          Rscript scripts/verify_browser_r_parity.R
      - name: Test real dataset converter using fictional CVAT fixtures
        run: python3 scripts/test_convert_digi4eco_cvat.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqt-browser-R-parity-evidence
          path: site-qualification/parity/
          if-no-files-found: warn
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            local::.
            any::pkgdown
            any::rmarkdown
            any::knitr
          extra-packages: any::yaml
          needs: website
      - name: Render site and enforce original scientific smoke checks
        run: |
          Rscript -e 'pkgdown::build_site(examples=FALSE, preview=FALSE, quiet=FALSE)'
          node scripts/polish_site_metadata.mjs
          node scripts/check_site_research_portal.mjs
      - name: Install pinned Chromium and axe-core testing dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.65.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Browser interactions privacy mobile WCAG and live webR runtime
        env:
          CI: "true"
          RUN_WEBR_NETWORK: "1"
        run: npx playwright test --config scripts/browser.playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqt-website-v2-Chromium-evidence
          path: |
            site-qualification/playwright-report/
            site-qualification/playwright-results/
            site-qualification/geometry-browser.png
          if-no-files-found: warn
