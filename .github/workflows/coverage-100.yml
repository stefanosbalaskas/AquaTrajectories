name: Coverage to 100 percent - real instrumented R expressions

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/**"
      - "R/**"
      - "scripts/coverage100_audit.py"
      - "scripts/core2_execution_coverage.R"
      - ".github/workflows/coverage-100.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aqt-covr100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  covr100:
    name: Actual covr package-test execution and full gap audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            local::.
            any::covr
            any::testthat
            any::svglite
            any::ragg
      - name: Assert all new boundary regressions before instrumentation
        shell: bash
        run: |
          Rscript --vanilla -e 'testthat::test_local(filter="covr100", reporter="summary", stop_on_failure=TRUE)'
      - name: Measure ALL tracked R function expressions with covr
        shell: bash
        run: |
          Rscript --vanilla scripts/core2_execution_coverage.R coverage100-real
      - name: Audit every unexecuted expression; require literal 100 percent
        shell: bash
        run: |
          python scripts/coverage100_audit.py coverage100-real --output coverage100-report --target 100
      - name: Preserve original and reviewed gap ledgers even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqt-coverage100-exact-head
          path: |
            coverage100-real/EXECUTED_COVERAGE.csv
            coverage100-real/EXECUTION_COVERAGE_SUMMARY.json
            coverage100-report/COVERAGE100_AUDIT.json
            coverage100-report/COVERAGE100_GAPS.md
            coverage100-report/UNCOVERED_EXPRESSIONS.csv
          if-no-files-found: warn
