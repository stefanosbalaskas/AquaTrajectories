name: Priority A independent mathematical and plotting qualification
on:
  pull_request:
    branches: [main]
    paths:
      - "R/**"
      - "tests/testthat/**"
      - "scripts/priority_a_validation_matrix.R"
      - "vignettes/articles/all-plot-functions.Rmd"
      - ".github/workflows/priority-a-independent-validation.yml"
      - "NAMESPACE"
      - "_pkgdown.yml"
      - "DESCRIPTION"
  push:
    branches: [main]
    paths:
      - "R/**"
      - "tests/testthat/**"
      - "scripts/priority_a_validation_matrix.R"
      - "vignettes/articles/all-plot-functions.Rmd"
      - ".github/workflows/priority-a-independent-validation.yml"
      - "NAMESPACE"
      - "_pkgdown.yml"
      - "DESCRIPTION"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: priority-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RGL_USE_NULL: "TRUE"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            local::.
            any::testthat
            any::yaml
            any::knitr
            any::rgl
      - name: Exact-source identification
        run: |
          git rev-parse HEAD
          Rscript -e 'cat("aquaTrajectories=",as.character(packageVersion("aquaTrajectories")),"\n")'
      - name: Independent numerical reference suite
        run: |
          Rscript -e 'library(aquaTrajectories); testthat::test_file("tests/testthat/test-priority-a-independent-references.R",reporter="summary",stop_on_failure=TRUE)'
      - name: Optics and uncertainty independent reference suite
        run: |
          Rscript -e 'library(aquaTrajectories); testthat::test_file("tests/testthat/test-priority-a-optics-uncertainty-references.R",reporter="summary",stop_on_failure=TRUE)'
      - name: Gap-safe geometric and figure suite
        run: |
          Rscript -e 'library(aquaTrajectories); testthat::test_file("tests/testthat/test-gap-safe-existing-data-figures.R",reporter="summary",stop_on_failure=TRUE)'
      - name: All six actual optional 3D rgl plotters
        run: |
          Rscript -e 'library(aquaTrajectories); testthat::test_file("tests/testthat/test-priority-a-rgl-plot-contracts.R",reporter="summary",stop_on_failure=TRUE)'
      - name: Build exhaustive API evidence ledger and plot-atlas figures
        run: |
          Rscript scripts/priority_a_validation_matrix.R priority-a-evidence
          test -s priority-a-evidence/FUNCTION_VALIDATION_MATRIX.csv
          test -s priority-a-evidence/QUALIFICATION_COUNTS.csv
          test -s priority-a-evidence/atlas/RENDERED_PLOT_ATLAS.md
      - name: Confirm no source changes were introduced by the qualification
        run: |
          test -z "$(git status --porcelain -- R tests man NAMESPACE)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: priority-a-independent-reference-and-native-plot-evidence
          path: priority-a-evidence/
          if-no-files-found: warn
