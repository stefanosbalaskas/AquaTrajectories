name: Wave 13E - full genuine Oxford fish video frozen model and ByteTrack benchmark

on:
  pull_request:
    paths:
      - "inst/python/aqt_oxford_frozen_sequence_benchmark.py"
      - "tests/python/test_oxford_frozen_sequence_benchmark.py"
      - ".github/workflows/oxford-frozen-sequence-benchmark.yml"
      - "docs/OXFORD_FROZEN_SEQUENCE_BENCHMARK.md"
  push:
    branches: [main]
    paths:
      - "inst/python/aqt_oxford_frozen_sequence_benchmark.py"
      - "tests/python/test_oxford_frozen_sequence_benchmark.py"
      - ".github/workflows/oxford-frozen-sequence-benchmark.yml"

permissions:
  contents: read

jobs:
  source-fish-sequence-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Real model plus tracker environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tensorflow-cpu==2.16.2" "Pillow>=10,<12" \
             "supervision==0.26.1" "numpy<2"
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Source model and real-clock contracts
        run: |
          python -m py_compile inst/python/aqt_oxford_frozen_sequence_benchmark.py
          python -m unittest discover -s tests/python -p "test_oxford_frozen_sequence_benchmark.py" -v
      - name: Download exactly versioned original Oxford frozen fish model and fish video
        shell: bash
        run: |
          MODEL="$RUNNER_TEMP/oxford_model"
          mkdir -p "$MODEL/variables"
          ROOT="https://raw.githubusercontent.com/ox-vgg/fish-tank-obstacles/0d57a17148f750ed7c327ba5d36ce587d3b7dcfe"
          BASE="$ROOT/data/models/detect/d2-fish/v2/saved_model"
          curl -fLsS --retry 3 --max-time 180 "$BASE/saved_model.pb" -o "$MODEL/saved_model.pb"
          curl -fLsS --retry 3 --max-time 180 "$BASE/variables/variables.index" -o "$MODEL/variables/variables.index"
          curl -fLsS --retry 3 --max-time 240 "$BASE/variables/variables.data-00000-of-00001" -o "$MODEL/variables/variables.data-00000-of-00001"
          curl -fLsS --retry 3 --max-time 120 "$ROOT/data/annotations/eval/fish/4-all-frames-DONE.json" -o "$RUNNER_TEMP/oxford_reviewed.json"
          curl -fLsS --retry 3 --max-time 240 "https://thor.robots.ox.ac.uk/~vgg/data/fish/fish-tank-obstacles-eval-15.zip" -o "$RUNNER_TEMP/oxford_eval.zip"
          python - <<'PY'
          import hashlib,os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          source=root/"oxford_eval.zip"
          assert hashlib.sha256(source.read_bytes()).hexdigest()=="91c71d297b7bfa6bd19c6f34ec5d12e1534bf7ef2f90d3249662605507ca9ae4"
          with zipfile.ZipFile(source) as z:
              clip=z.read("eval/F30_T15.mp4")
          assert hashlib.sha256(clip).hexdigest()=="acd118909b7bd44b013450e35525409ab2bfe53e15e81f48834fe33bfea682c0"
          (root/"real_oxford_fish.mp4").write_bytes(clip)
          print("Source dataset and recording hashes qualified")
          PY
      - name: Decode all source video PTS and pixel frames
        shell: bash
        run: |
          python inst/python/aqt_oxford_video_probe.py \
            --archive "$RUNNER_TEMP/oxford_eval.zip" \
            --member "eval/F30_T15.mp4" --session-id oxford_eval \
            --camera-id oxford_single_video \
            --output-dir "$RUNNER_TEMP/oxford_real_clock"
          mkdir -p "$RUNNER_TEMP/video_pixels"
          ffmpeg -nostdin -hide_banner -loglevel error \
            -i "$RUNNER_TEMP/real_oxford_fish.mp4" \
            -vsync 0 -start_number 0 -q:v 2 \
            "$RUNNER_TEMP/video_pixels/f%05d.jpg"
      - name: Run 149 real frame frozen fish model and genuine ByteTrack; quantify source-label agreement
        shell: bash
        run: |
          python inst/python/aqt_oxford_frozen_sequence_benchmark.py \
            --model-dir "$RUNNER_TEMP/oxford_model" \
            --images "$RUNNER_TEMP/video_pixels" \
            --frame-manifest "$RUNNER_TEMP/oxford_real_clock/frames.csv" \
            --reviewed-lisa "$RUNNER_TEMP/oxford_reviewed.json" \
            --original-video "$RUNNER_TEMP/real_oxford_fish.mp4" \
            --output-dir "$RUNNER_TEMP/oxford_new_model_full_benchmark"
          python - <<'PY'
          import json,os,pathlib,csv
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"oxford_new_model_full_benchmark"
          report=json.loads((p/"summary.json").read_text())
          assert report["source_video_model_forward_pass_count"]==149,report
          assert report["scoring"]["0.5"]["n_frames"]==149,report
          assert report["scoring"]["0.7"]["n_frames"]==149,report
          assert report["newly_inferred_detector_rows_at_min_confidence"]>0,report
          assert report["newly_generated_bytetrack_rows"]>0,report
          assert not report["original_source_labels_prediction_blind_externally_verified"]
          assert not report["official_HOTA_IDF1_measured"]
          with (p/"model_generated_bytetrack.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==report["newly_generated_bytetrack_rows"]
          print("REAL full fish-video detector + tracker benchmark PASSED")
          print("Newly generated source-labelled F1:",
                report["scoring"]["0.5"]["F1"])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wave13e-real-model-detections-tracks-and-source-agreement
          path: |
            ${{ runner.temp }}/oxford_new_model_full_benchmark/summary.json
            ${{ runner.temp }}/oxford_new_model_full_benchmark/model_generated_detections.csv
            ${{ runner.temp }}/oxford_new_model_full_benchmark/model_generated_bytetrack.csv
            ${{ runner.temp }}/oxford_real_clock/frames.csv
